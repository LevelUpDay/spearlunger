name: inspect
on: [push]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache
      - name: dump
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/src /tmp/mc
          J=$(find ~/.gradle .gradle -name 'minecraft-*sources.jar' 2>/dev/null | grep -v common | head -1)
          [ -z "$J" ] && J=$(find ~/.gradle .gradle -name '*sources.jar' | grep -i minecraft | head -1)
          echo "JAR=$J"; find ~/.gradle .gradle -name '*sources.jar' | grep -i minecraft
          for j in $(find ~/.gradle .gradle -name '*sources.jar' | grep -i minecraft); do unzip -oq "$(realpath $j)" -d /tmp/src; done
          C=$(find ~/.gradle .gradle -name '*.jar' | grep -i minecraft | grep -v sources); echo "$C"
          for j in $C; do unzip -oq "$(realpath $j)" 'data/minecraft/enchantment/*' 'data/minecraft/item/*spear*' -d /tmp/mc 2>/dev/null; done
          cd /tmp/src
          g "public void attackWithPiercingWeapon" net/minecraft/client/network/ClientPlayerInteractionManager.java 8
          g "public boolean isFlyingLocked" net/minecraft/client/network/ClientPlayerInteractionManager.java 6
          g "private void syncSelectedSlot" net/minecraft/client/network/ClientPlayerInteractionManager.java 10
          grep -rn "resetTicksSince()" net/minecraft | head -20
          grep -n -B12 -A3 "resetTicksSince()" net/minecraft/entity/LivingEntity.java net/minecraft/entity/player/PlayerEntity.java | head -80
          grep -n -A12 "EntityAttributes.ATTACK_SPEED," net/minecraft/item/Item.java | sed -n 1,40p
          g "public void beforePlayerAttack\|public void useAttackEnchantmentEffects" net/minecraft/entity/LivingEntity.java 15
          g "public void beforePlayerAttack\|public void useAttackEnchantmentEffects" net/minecraft/entity/player/PlayerEntity.java 15
          grep -rn "POST_PIERCING_ATTACK" net/minecraft | head
